thresholds:
  min_total_score: 0.72
  min_sources: 2
  min_primary_sources: 1
  min_independent_sources: 1
  duplicate_lookback_days: 0 # Zero means all available publication history, with no expiry.
models:
  text: gemini-2.5-flash
  image: gemini-3.1-flash-image
visuals:
  allow_ai_illustrations: false
  provider: codex_manual
  direction: >-
    Preserve the highest native image quality. Capture app screens at 3x pixel
    density, normally 4800x3360 lossless PNG. Use imagegen at its highest available
    native quality. Never upscale small images or use lossy recompression. Check
    sharp edges and text at full size and readable key labels at phone size.
    Polished editorial graphics and clear data visuals with a strong complete title,
    generous spacing, short readable captions, and a concrete connection to the post.
    Codex-generated images must use relevant symbols, icons and diagrams to explain
    the idea. Give these visuals enough space to be understood at phone size. Keep
    text to a short title, labels and brief captions. Reject paragraphs in boxes
    and layouts where icons are only small decorations around text.
    For workflow posts, visualize the actual workflow discussed in the post: inputs,
    ordered steps, decisions, handoffs, relevant revision or failure paths, and outputs.
    Use a process map for sequential steps, a decision flow for branching logic, or
    swimlanes when ownership across people and tools matters. Show only steps and
    connections supported by the post and its evidence; label proposed workflows as
    proposed. Use real portfolio screenshots where relevant and label illustrative
    data explicitly. Every image must be visually inspected at phone size.
  avoid:
  - sketches and hand-drawn illustrations
  - model drawings and wireframes
  - generic AI artwork and decorative stick figures
  - internal drafting notes or placeholder text in artwork
  - truncated headlines and unlabeled decorative charts
  - dark 3D boardroom scenes by default
  - unlabeled abstract metaphors
  - unreadable tiny UI text
  - misspelled generated text
  - neon-by-default
  - glowing brains and circuit-board cliches
  - robot faces and generic AI imagery
  - sparse skeleton diagrams
  - text-only quote cards
  - paragraphs in boxes with only decorative icons
  - synthetic photorealism
