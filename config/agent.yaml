  min_sources: 2
  min_primary_sources: 1
  min_independent_sources: 1
  duplicate_lookback_days: 45
models:
  text: gemini-2.5-flash
  image: gemini-3.1-flash-image
visuals:
  allow_ai_illustrations: false
  provider: codex_manual
  direction: clean light-background LinkedIn infographics with a strong title, numbered cards or clearly separated sections, arrows where movement matters, simple icons, short readable captions, and concise takeaway areas; use square or landscape depending on the post, but keep the image easy to understand in seconds
  avoid:
  - dark 3D boardroom scenes by default
  - unlabeled abstract metaphors
  - unreadable tiny UI text
  - misspelled generated text
  - neon-by-default
  - glowing brains and circuit-board cliches
  - robot faces and generic AI imagery
  - sparse skeleton diagrams
  - text-only quote cards
  - synthetic photorealism
