name: Weekday LinkedIn Post

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Prepare a fresh project draft or run the publisher"
        required: true
        default: "publish"
        type: choice
        options: ["prepare", "publish"]
      dry_run:
        description: "Verify the exact draft and image without publishing"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]
  schedule:
    - cron: "17 8 * * 1-5"

permissions:
  contents: write
  issues: write

concurrency:
  group: linkedin-publication
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
      LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      LINKEDIN_TOKEN_EXPIRES_AT: ${{ vars.LINKEDIN_TOKEN_EXPIRES_AT }}
      TASK_MODE: ${{ inputs.mode || 'publish' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -e .
      - name: Restore audit state
        id: restore
        run: |
          set -euo pipefail
          git fetch origin automation-state
          git checkout origin/automation-state -- .state reports
          test -f .state/publication_history.json
      - name: Check LinkedIn token
        id: token
        run: |
          python -m linkedin_ai_agent.cli token-status > token_status.json
          STATUS=$(python -c "import json; print(json.load(open('token_status.json'))['status'])")
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
      - name: Open token renewal issue
        if: steps.token.outputs.status == 'expiring_soon' || steps.token.outputs.status == 'expired'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --state open --search "LinkedIn token expires soon in:title" --json number --jq '.[0].number')
          if [ -z "$existing" ]; then
            gh issue create --title "LinkedIn token expires soon" --body "Renew the personal LinkedIn OAuth token and update LINKEDIN_ACCESS_TOKEN and LINKEDIN_TOKEN_EXPIRES_AT before the recorded expiry."
          fi
      - name: Prepare or verify or publish
        id: agent
        run: |
          set -o pipefail
          if [ "$TASK_MODE" = "prepare" ]; then
            python -m linkedin_ai_agent.cli prepare-post | tee agent_result.json
          elif [ "$DRY_RUN" = "true" ]; then
            python -m linkedin_ai_agent.cli run --dry-run | tee agent_result.json
          else
            python -m linkedin_ai_agent.cli run | tee agent_result.json
          fi
      - name: Save audit state
        if: always() && steps.restore.outcome == 'success' && (env.TASK_MODE == 'prepare' || env.DRY_RUN != 'true')
        run: |
          set -euo pipefail
          AUDIT_CHECKOUT="$RUNNER_TEMP/linkedin-audit"
          git worktree add --detach "$AUDIT_CHECKOUT" origin/automation-state
          rsync -a --delete .state/ "$AUDIT_CHECKOUT/.state/"
          rsync -a reports/ "$AUDIT_CHECKOUT/reports/"
          git -C "$AUDIT_CHECKOUT" config user.name "github-actions[bot]"
          git -C "$AUDIT_CHECKOUT" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$AUDIT_CHECKOUT" add -f .state reports
          if ! git -C "$AUDIT_CHECKOUT" diff --cached --quiet; then
            git -C "$AUDIT_CHECKOUT" commit -m "Update LinkedIn agent audit state"
            git -C "$AUDIT_CHECKOUT" push origin HEAD:automation-state
          fi
      - name: Summarize outcome
        if: always()
        run: |
          python scripts/workflow_summary.py >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linkedin-agent-reports
          include-hidden-files: true
          path: |
            reports/*.json
            assets/codex_weekday_*.png
            assets/codex_weekday_*.json
            assets/briefs/*.json
            .state/pending_image_post.json
            .state/publication_history.json
            .state/publication_attempt.json
            agent_result.json
            token_status.json
          if-no-files-found: warn
