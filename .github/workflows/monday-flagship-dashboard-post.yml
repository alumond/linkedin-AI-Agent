name: Monday Flagship Dashboard Post

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without publishing to LinkedIn"
        required: true
        default: "false"
        type: choice
        options: ["true", "false"]
      force_publish:
        description: "Publish dashboard post even when not in the one-time date window"
        required: true
        default: "false"
        type: choice
        options: ["true", "false"]
  schedule:
    - cron: "0 10 10 8 *"

permissions:
  contents: write
  issues: write

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      LINKEDIN_TOKEN_EXPIRES_AT: ${{ vars.LINKEDIN_TOKEN_EXPIRES_AT }}
    steps:
      - uses: actions/checkout@v4

      - name: Guard one-time flagship date
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_publish }}" = "true" ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%F)" = "2026-08-10" ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "This workflow is only allowed to publish on 2026-08-10."
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.allowed == 'true'
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.guard.outputs.allowed == 'true'
        run: python -m pip install -e .

      - name: Restore automation state
        if: steps.guard.outputs.allowed == 'true'
        run: |
          git fetch origin automation-state || true
          if git show-ref --verify --quiet refs/remotes/origin/automation-state; then
            git checkout origin/automation-state -- .state reports || true
          fi

      - name: Check LinkedIn token
        if: steps.guard.outputs.allowed == 'true'
        id: token
        run: |
          python -m linkedin_ai_agent.cli token-status > token_status.json || true
          STATUS=$(python -c "import json; print(json.load(open('token_status.json')).get('status','missing'))")
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Open token renewal issue
        if: steps.guard.outputs.allowed == 'true' && steps.token.outputs.status == 'expiring_soon'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --state open --search "LinkedIn token expires soon in:title" --json number --jq '.[0].number')
          if [ -z "$existing" ]; then
            gh issue create --title "LinkedIn token expires soon" --body "Renew the personal LinkedIn OAuth token within seven days and update LINKEDIN_ACCESS_TOKEN."
          fi

      - name: Publish featured dashboard post
        if: steps.guard.outputs.allowed == 'true'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m linkedin_ai_agent.cli featured-dashboard --dry-run
          else
            python -m linkedin_ai_agent.cli featured-dashboard
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monday-flagship-dashboard-post
          path: |
            reports/*.json
            token_status.json
          if-no-files-found: ignore

      - name: Push audit state
        if: always() && steps.guard.outputs.allowed == 'true'
        run: |
          mkdir -p /tmp/linkedin-agent-state
          cp -R .state /tmp/linkedin-agent-state/.state || true
          cp -R reports /tmp/linkedin-agent-state/reports || true
          git fetch origin automation-state || true
          if git show-ref --verify --quiet refs/remotes/origin/automation-state; then
            git checkout automation-state
          else
            git checkout --orphan automation-state
            git rm -rf . || true
          fi
          mkdir -p .state reports
          cp -R /tmp/linkedin-agent-state/.state/. .state/ || true
          cp -R /tmp/linkedin-agent-state/reports/. reports/ || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .state reports
          git commit -m "Update LinkedIn featured dashboard audit state" || exit 0
          git push origin automation-state
