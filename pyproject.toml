[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-ai-agent"
version = "0.1.0"
description = "Gemini-powered agent for researched Data and AI LinkedIn posts."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "google-genai>=1.0.0",
  "Pillow>=10.0.0",
  "PyYAML>=6.0.0",
  "requests>=2.31.0",
  "urllib3<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
linkedin-ai-agent = "linkedin_ai_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
